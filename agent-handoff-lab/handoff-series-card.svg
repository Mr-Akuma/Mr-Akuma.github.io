<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="ui-monospace,'JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#293A4F"/>
      <stop offset="0.5" stop-color="#34D3E6"/>
      <stop offset="1" stop-color="#293A4F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#34D3E6" stop-opacity="0.12"/>
      <stop offset="0.55" stop-color="#34D3E6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#182333" stroke-width="1"/>
    </pattern>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#34D3E6"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="#070A10"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="8" y="8" width="1184" height="614" rx="10" fill="none" stroke="#293A4F" stroke-width="1.5"/>

  <!-- eyebrow -->
  <text x="80" y="118" fill="#34D3E6" font-size="26" letter-spacing="6" font-weight="700">NEW MINI BLOG SERIES &#183; MULTI-AGENT SECURITY</text>

  <!-- title -->
  <text x="78" y="212" fill="#D7E2F0" font-size="82" font-weight="700" letter-spacing="-1">The handoff is the</text>
  <text x="78" y="300" fill="#34D3E6" font-size="82" font-weight="700" letter-spacing="-1">soft joint</text>

  <!-- agent rail -->
  <g transform="translate(0,430)">
    <!-- wires -->
    <line x1="300" y1="0" x2="470" y2="0" stroke="url(#wire)" stroke-width="3" marker-end="url(#ar)"/>
    <line x1="730" y1="0" x2="900" y2="0" stroke="url(#wire)" stroke-width="3" marker-end="url(#ar)"/>

    <!-- seam payload on second wire, clear of the Ops node -->
    <rect x="685" y="-74" width="210" height="34" rx="4" fill="#FF5C52"/>
    <text x="790" y="-50" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">[[SETROLE:admin]]</text>
    <line x1="790" y1="-40" x2="790" y2="-8" stroke="#FF5C52" stroke-width="2"/>
    <circle cx="790" cy="0" r="7" fill="#FF5C52"/>

    <!-- nodes -->
    <g>
      <rect x="120" y="-46" width="180" height="92" rx="6" fill="#0C121B" stroke="#293A4F" stroke-width="1.5"/>
      <text x="210" y="-8" fill="#5F7089" font-size="17" letter-spacing="2" text-anchor="middle">TIER 0</text>
      <text x="210" y="26" fill="#D7E2F0" font-size="26" font-weight="700" text-anchor="middle">Triage</text>
    </g>
    <g>
      <rect x="470" y="-46" width="180" height="92" rx="6" fill="#0C121B" stroke="#293A4F" stroke-width="1.5"/>
      <text x="560" y="-8" fill="#5F7089" font-size="17" letter-spacing="2" text-anchor="middle">TIER 1</text>
      <text x="560" y="26" fill="#D7E2F0" font-size="26" font-weight="700" text-anchor="middle">Account</text>
    </g>
    <g>
      <rect x="900" y="-46" width="180" height="92" rx="6" fill="#0C121B" stroke="#FF5C52" stroke-width="1.5"/>
      <text x="990" y="-8" fill="#FF5C52" font-size="17" letter-spacing="2" text-anchor="middle">TIER 2 &#183; PRIV</text>
      <text x="990" y="26" fill="#D7E2F0" font-size="26" font-weight="700" text-anchor="middle">Ops</text>
    </g>
  </g>

  <!-- caption -->
  <text x="80" y="548" fill="#5F7089" font-size="20" letter-spacing="1">the agents are fine in isolation &#183; the exploits live in the wires between them</text>
</svg>
