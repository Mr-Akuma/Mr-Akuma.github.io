<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow" cx="0.78" cy="0.08" r="0.75">
      <stop offset="0" stop-color="#ff5d5d" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#ff5d5d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1c1d22" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ff5d5d"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="#0e0f12"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="8" y="8" width="1184" height="614" rx="10" fill="none" stroke="#272830" stroke-width="1.5"/>

  <text x="76" y="104" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="22" letter-spacing="4" font-weight="700" fill="#ff5d5d">PART 1 &#183; AI AGENT TRUST BOUNDARIES</text>

  <text x="74" y="196" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" fill="#e7e7ea">Nobody Guarded</text>
  <text x="74" y="276" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" fill="#e7e7ea">the Intercom</text>

  <!-- two-door panel -->
  <g transform="translate(74,330)">
    <rect x="0" y="0" width="460" height="150" rx="10" fill="#17181c" stroke="#e7e7ea" stroke-width="1.5"/>
    <text x="24" y="34" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#e7e7ea">OS sandbox</text>
    <text x="24" y="60" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="14" fill="#9a9aa2">file writes outside workspace</text>
    <text x="436" y="60" text-anchor="end" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#9a9aa2">denied</text>
    <text x="24" y="90" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="14" fill="#9a9aa2">process exec &#183; file reads</text>
    <text x="436" y="90" text-anchor="end" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="14" fill="#9a9aa2">allowed</text>
    <text x="24" y="122" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#ff5d5d">loopback networking</text>
    <text x="436" y="122" text-anchor="end" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#ff5d5d">allowed</text>

    <path d="M470,75 L620,75" fill="none" stroke="#ff5d5d" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="636" y="0" width="470" height="150" rx="10" fill="#17181c" stroke="#ff5d5d" stroke-width="2"/>
    <text x="660" y="34" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#e7e7ea">Control API &#183; 127.0.0.1:3080</text>
    <text x="660" y="62" font-family="SFMono-Regular, Consolas, monospace" font-size="15" fill="#e7e7ea">isTrustedApiRequest()</text>
    <text x="660" y="86" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="14" fill="#9a9aa2">trusts the client Host header</text>
    <text x="660" y="108" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="14" fill="#9a9aa2">never checks the real peer</text>
    <rect x="660" y="118" width="98" height="22" rx="11" fill="#0e0f12" stroke="#ff5d5d"/>
    <text x="709" y="133" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="12.5" fill="#ff5d5d">CWE-807</text>
  </g>

  <text x="76" y="560" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="19" fill="#9a9aa2">5 sandbox escapes &#183; 4 vendors &#183; DeepSeek &#183; OpenAI Codex &#183; Cursor &#183; Docker</text>
  <text x="76" y="592" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-style="italic" fill="#e7e7ea">the sandbox did exactly what it was told to restrict.</text>
</svg>
